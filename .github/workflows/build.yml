name: Build Vidaa EPG
on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate guide
        run: |
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          python3 m3u2xmltv.py https://www.apsattv.com/vidaa.m3u \
            --days 3 --out vidaa --guide-url "$RAW/vidaa.xml.gz"
          gzip -kf vidaa.xml
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vidaa.xml.gz vidaa_epg.m3u
          git commit -m "Update EPG $(date -u +%F)" || echo "no changes"
          git push
